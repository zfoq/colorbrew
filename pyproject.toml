[project]
name = "colorbrew"
version = "0.10.0"
description = "A lightweight, zero-dependency Python library for color manipulation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Dawid Prus" }]
keywords = ["color", "hex", "rgb", "hsl", "hsv", "css", "palette", "accessibility", "wcag", "colorblind", "tailwind", "material-design", "ciede2000", "delta-e", "lab"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/zfoq/colorbrew"
Repository = "https://github.com/zfoq/colorbrew"
Changelog = "https://github.com/zfoq/colorbrew/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    "/.vscode",
    "/.vscode/**",
    "/.gitmodules",
]

[tool.hatch.build.targets.wheel]
packages = ["src/colorbrew"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 90
